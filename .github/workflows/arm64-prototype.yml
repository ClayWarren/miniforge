name: Windows ARM64 installer prototype
on:
  push:
    branches: [codex/windows-arm64-prototype]
permissions:
  contents: read
  actions: read
jobs:
  prototype:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch retained Conda package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force local-channel/win-arm64 | Out-Null
          gh run download 34523353459 --repo ClayWarren/conda-feedstock --name conda320-win-arm64 --dir local-channel/win-arm64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Provision x64 build tools under emulation
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-win-64 -OutFile "$env:RUNNER_TEMP/micromamba.exe"
          & "$env:RUNNER_TEMP/micromamba.exe" create -y -p C:/prototype-tools --platform win-64 -c conda-forge --override-channels python=3.14 constructor=3.16.1 conda-index pip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Construct ARM64 installer with Constructor 3.17.1
        shell: cmd
        run: |
          call C:\prototype-tools\condabin\conda.bat activate C:\prototype-tools
          if errorlevel 1 exit /b 1
          python prototype\prepare.py
          if errorlevel 1 exit /b 1
      - name: Install and exercise native base
        shell: pwsh
        run: ./prototype/test.ps1
      - name: Preserve prototype and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniforge-win-arm64-prototype
          path: |
            build/*
            prototype-results/*
            prototype-recipe/construct.yaml
          if-no-files-found: warn
