name: Windows NumPy acceptance
on:
  push:
    branches: [codex/windows-numpy-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  numpy:
    name: NumPy-${{ matrix.ARCH }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ARCH: x86_64
            run: 34530152586
            artifact: Miniforge3-Windows-x86_64
            destination: build
            sha256: 99a202a609e9e3f764668a8c240f625de5170f2624bbd2bd77cc851f43138f91
          - os: windows-11-arm
            ARCH: arm64
            run: 34532168110
            artifact: arm64-integration-build
            destination: .
            sha256: 31095863cff81a2c768da9150474e4bf65537bd0e7676aa20644607053639ab8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ matrix.run }}' --repo ClayWarren/miniforge --name '${{ matrix.artifact }}' --dir '${{ matrix.destination }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem 'build/*Windows-${{ matrix.ARCH }}.exe')
          if ($files.Count -ne 1) { throw 'Expected one installer' }
          if ((Get-FileHash $files[0].FullName -Algorithm SHA256).Hash -ne '${{ matrix.sha256 }}') { throw 'Installer checksum mismatch' }
      - name: Online installer and NumPy acceptance
        shell: pwsh
        run: ./scripts/test_windows.ps1 -Architecture '${{ matrix.ARCH }}'
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-${{ matrix.ARCH }}-numpy-acceptance
          path: build/windows-tests-*
