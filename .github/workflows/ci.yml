name: Windows integration validation
on:
  push:
    branches: [codex/windows-integration-validation]
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Miniforge3-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ARCH: x86_64
            TARGET_PLATFORM: win-64
            OS_NAME: "Windows"
            DOCKERIMAGE: ""
            DOCKER_ARCH: ""
            TEST_IMAGE_NAMES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: "latest"
          # NSIS and conda-standalone build tools run under emulation on Windows ARM64.
          architecture: ${{ matrix.OS_NAME == 'Windows' && 'x64' || '' }}
          use-mamba: true
        if: ${{ ! contains(matrix.OS_NAME, 'Linux') }}

      - name: Prepare certificates (macOS)
        if: startsWith(matrix.TARGET_PLATFORM, 'osx-') && github.event_name != 'pull_request'
        env:
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_INSTALLER_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_INSTALLER_PASSWORD }}
          APPLE_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_APPLICATION_BASE64 }}
          APPLE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_APPLICATION_PASSWORD }}
          APPLE_TEMP_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_TEMP_KEYCHAIN_PASSWORD }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_AUTHKEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_AUTHKEY_BASE64 }}
        run: |
          if [[ "${APPLE_NOTARIZATION_KEY_ID:-}" == "" ]]; then
            exit 0  # skip if secrets are not populated
          fi

          # This script will export APPLE_SIGNING_IDENTITY and APPLE_NOTARIZATION_IDENTITY
          source scripts/osx_prepare_certificates.sh

          # These will be needed by the build.sh script
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "APPLE_NOTARIZATION_IDENTITY=$APPLE_NOTARIZATION_IDENTITY" >> $GITHUB_ENV
          echo "APPLE_NOTARIZATION_ISSUER_ID=$APPLE_NOTARIZATION_ISSUER_ID" >> $GITHUB_ENV
          echo "APPLE_NOTARIZATION_KEY_ID=$APPLE_NOTARIZATION_KEY_ID" >> $GITHUB_ENV
          echo "APPLE_NOTARIZATION_AUTHKEY_PATH=$APPLE_NOTARIZATION_AUTHKEY_PATH" >> $GITHUB_ENV

      - name: Enable PKGs (macOS)
        if: startsWith(matrix.TARGET_PLATFORM, 'osx-')
        run: |
          # This env var is read in construct.yaml; we need 'all' to build both SH and PKG
          echo "MINIFORGE_INSTALLER_TYPE=all" >> $GITHUB_ENV

      - name: Build and test miniforge
        env:
          ARCH: ${{ matrix.ARCH }}
          OS_NAME: ${{ matrix.OS_NAME }}
          DOCKERIMAGE: ${{ matrix.DOCKERIMAGE }}
          DOCKER_ARCH: ${{ matrix.DOCKER_ARCH }}
          TARGET_PLATFORM: ${{ matrix.TARGET_PLATFORM }}
          TEST_IMAGE_NAMES: ${{ matrix.TEST_IMAGE_NAMES }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export MINIFORGE_VERSION=${GITHUB_REF##*/};
          fi
          if [[ "$OS_NAME" == "Linux" ]]; then
            bash build_miniforge.sh;
          elif [[ "$OS_NAME" == "MacOSX" ]]; then
            bash build_miniforge_osx.sh;
          elif [[ "$OS_NAME" == "Windows" ]]; then
            echo "WINDIR:$WINDIR"
            source "${CONDA}"/Scripts/activate;
            source build_miniforge_win.sh;
          fi
        shell: bash

      - name: Azure login (Windows)
        if: >-
          startsWith(matrix.TARGET_PLATFORM, 'win-')
          && github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/')
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: >-
            {
              "clientId": "${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_SECRET_VALUE }}",
              "subscriptionId": "${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}"
            }
      
      # NOTE: Azure Code Signing has a monthly quota. Every time a given file
      # is signed, it counts as a signature. These certificates are shared with
      # other NumFOCUS projects, so we only sign final releases. We don't want to
      # sign on regular PRs CI or upon merges to main. Only releases!
      - name: Sign files with Artifact Signing (Windows)
        if: >- 
          startsWith(matrix.TARGET_PLATFORM, 'win-')
          && github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/')
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.WINDOWS_SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and checksums (Windows)
        if: >- 
          startsWith(matrix.TARGET_PLATFORM, 'win-')
          && github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/verify_signatures_and_checksums.ps1

      - name: Copy for latest release
        env:
          ARCH: ${{ matrix.ARCH }}
          OS_NAME: ${{ matrix.OS_NAME }}
          EXT: ${{ matrix.OS_NAME == 'Windows' && 'exe' || 'sh' }}
        run: |
          # Copy for latest release
          cp build/Miniforge3-*-$OS_NAME-$ARCH.$EXT build/Miniforge3-$OS_NAME-$ARCH.$EXT
          if [[ "$OS_NAME" == "MacOSX" ]]; then
            # Copy PKGs too, and alias -MacOSX- to -Darwin-
            cp build/Miniforge3-*-$OS_NAME-$ARCH.$EXT build/Miniforge3-Darwin-$ARCH.$EXT
            cp build/Miniforge3-*-$OS_NAME-$ARCH.pkg build/Miniforge3-$OS_NAME-$ARCH.pkg
            cp build/Miniforge3-*-$OS_NAME-$ARCH.pkg build/Miniforge3-Darwin-$ARCH.pkg
          fi
          ls -alh build
        shell: bash

      - name: Upload miniforge to Github artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/Miniforge3-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}*
          name: Miniforge3-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}

      - name: Upload miniforge to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/M*forge*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')

  arm64-acceptance:
    name: Miniforge3-Windows-arm64 (retained prototype)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify retained ARM64 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34527627394 --repo ClayWarren/miniforge --name miniforge-win-arm64-prototype --dir .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $file = Get-Item build/Miniforge3-26.7.2-0-Windows-arm64.exe
          if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne '8C796301FEDC821A0B6D94A672C307D23914600CBF49656D86EA7CF6B3CD2ED8') { throw 'Installer checksum mismatch' }
      - name: Run shared Windows acceptance
        shell: pwsh
        run: ./scripts/test_windows.ps1 -Architecture arm64
      - name: Retain installer for offline test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Miniforge3-Windows-arm64
          path: build/Miniforge3-26.7.2-0-Windows-arm64.exe
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-arm64-online-evidence
          path: build/windows-tests-*

  # Independent job that proves the *installer itself* provisions the base
  # environment with no network access. This consumes the artifact built above
  # (it does not rebuild) and runs the installer with outbound network disabled,
  # so it would catch regressions like
  #   https://github.com/conda-forge/miniforge/issues/883
  # where the bundled mamba/micromamba downloaded the embedded packages instead
  # of unpacking the embedded payload.
  test-offline:
    name: Offline-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}
    needs: [build, arm64-acceptance]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ARCH: x86_64
            OS_NAME: "Windows"
          - os: windows-11-arm
            ARCH: arm64
            OS_NAME: "Windows"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Miniforge3-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}
          path: build

      - name: Run installer with outbound traffic blocked (Windows)
        if: matrix.OS_NAME == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows.ps1 -Architecture '${{ matrix.ARCH }}' -Offline

      - name: Retain offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-${{ matrix.ARCH }}-offline-evidence
          path: build/windows-tests-*
